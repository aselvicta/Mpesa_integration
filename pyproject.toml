[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpesa-tz"
version = "0.2.0"
description = "M-Pesa Tanzania (Vodacom M-Pesa OpenAPI) integration: STK push / C2B, B2C, B2B, status query and reversal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Victor Asel"}]
keywords = ["mpesa", "m-pesa", "vodacom", "tanzania", "payments", "stk push", "openapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.25",
    "cryptography>=3.4",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=0.19"]
django = ["Django>=3.2"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "responses>=0.23",
    "python-dotenv>=0.19",
    "Django>=3.2",
    "pytest-django>=4.5",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/aselvicta/Mpesa_integration"
Source = "https://github.com/aselvicta/Mpesa_integration"

[project.scripts]
mpesa-tz = "mpesa_tz.__main__:main"

[tool.setuptools.packages.find]
include = ["mpesa_tz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real M-Pesa sandbox (needs MPESA_* env vars and MPESA_LIVE_TESTS=1)"]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
pythonpath = ["."]
